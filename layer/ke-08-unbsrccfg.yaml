# METABEGIN
# X-Env-Layer-Name: ke-unbsrccfg
# X-Env-Layer-Desc: Install source-built Unbound artifacts when available
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: networking
# X-Env-Layer-Requires: ke-netcfg
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  customize-hooks:
    - |
      # Install source-built Unbound artifacts from staging if present.
      # Keep this hook POSIX-sh compatible (mmdebstrap runs hooks under /bin/sh).
      STAGING_ROOT="${IGconf_sys_buildroot}/staging"
      if [ ! -d "$STAGING_ROOT" ] && [ -n "${IGconf_sys_workroot:-}" ] && [ -d "${IGconf_sys_workroot}/build/staging" ]; then
        STAGING_ROOT="${IGconf_sys_workroot}/build/staging"
      fi
      STAGING_USR=""

      if [ -d "$STAGING_ROOT" ]; then
        staging_usr_file="$(mktemp)"
        find "$STAGING_ROOT" -mindepth 2 -maxdepth 2 -type d -name usr 2>/dev/null | sort | while IFS= read -r candidate; do
          if [ -x "$candidate/sbin/unbound" ] || [ -x "$candidate/bin/unbound" ]; then
            printf '%s\n' "$candidate" > "$staging_usr_file"
            break
          fi
        done
        if [ -s "$staging_usr_file" ]; then
          STAGING_USR="$(cat "$staging_usr_file")"
        fi
        rm -f "$staging_usr_file"
      fi

      if [ -z "$STAGING_USR" ]; then
        echo "INFO: ke-unbsrccfg: no source-built Unbound artifacts detected under $STAGING_ROOT; falling back to package-managed unbound"
        exit 0
      fi

      echo "INFO: ke-unbsrccfg: installing Unbound artifacts from $STAGING_USR"
      install -d -m 0755 "$1/usr/sbin" "$1/usr/bin" "$1/usr/lib" "$1/usr/libexec"

      # Register a local dpkg diversion before overwriting each binary so a
      # later apt upgrade/reinstall of the unbound package (or a newly
      # installed unbound-anchor/unbound-host) unpacks to <path>.distrib
      # instead of silently replacing the source build.  --rename parks any
      # package-owned file currently at the path; paths no package ships yet
      # are diverted defensively.  The libunbound copies below need no
      # diversion: Debian ships libunbound under /usr/lib/<multiarch>/,
      # never /usr/lib/ itself.
      ROOTFS="$1"
      divert() {
        chroot "$ROOTFS" dpkg-divert --local --rename --divert "$1.distrib" --add "$1"
      }

      if [ -x "$STAGING_USR/sbin/unbound" ]; then
        divert /usr/sbin/unbound
        cp -a "$STAGING_USR/sbin/unbound" "$1/usr/sbin/"
      fi
      if [ -x "$STAGING_USR/sbin/unbound-anchor" ]; then
        divert /usr/sbin/unbound-anchor
        cp -a "$STAGING_USR/sbin/unbound-anchor" "$1/usr/sbin/"
      fi
      if [ -x "$STAGING_USR/sbin/unbound-checkconf" ]; then
        divert /usr/sbin/unbound-checkconf
        cp -a "$STAGING_USR/sbin/unbound-checkconf" "$1/usr/sbin/"
      fi
      if [ -x "$STAGING_USR/sbin/unbound-control" ]; then
        divert /usr/sbin/unbound-control
        cp -a "$STAGING_USR/sbin/unbound-control" "$1/usr/sbin/"
      fi
      if [ -x "$STAGING_USR/sbin/unbound-host" ]; then
        divert /usr/sbin/unbound-host
        cp -a "$STAGING_USR/sbin/unbound-host" "$1/usr/sbin/"
      fi
      if [ -x "$STAGING_USR/sbin/unbound-control-setup" ]; then
        divert /usr/sbin/unbound-control-setup
        cp -a "$STAGING_USR/sbin/unbound-control-setup" "$1/usr/sbin/"
      fi

      if [ -d "$STAGING_USR/lib" ]; then
        cp -a "$STAGING_USR/lib/libunbound"*.so* "$1/usr/lib/" 2>/dev/null || true
      fi

      if [ -d "$STAGING_USR/libexec" ]; then
        cp -a "$STAGING_USR/libexec/unbound" "$1/usr/libexec/" 2>/dev/null || true
      fi
